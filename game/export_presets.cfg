[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,data/dev/*.json,data/styles/*.json,assets/**/*.json,assets/**/*.png"
exclude_filter="build/*"
export_path="../frontend/public/aquarium/index.html"
script_export_mode=2

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=false
html/head_include="<style>html, body, canvas { margin:0; background:#EAF6F2; } #canvas { image-rendering:pixelated; } #status { background:#EAF6F2; }</style>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
